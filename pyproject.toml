[project]
name = "codetrace"
version = "0.1.0"
description = "CodeTrace: measuring context loss between code exploration and patch generation in coding agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Adebanji Adelowo" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Live model calls (not needed for tests or the scripted smoke test).
anthropic = ["anthropic>=1.0"]
# Official SWE-bench evaluator. Heavy (docker, datasets, modal); install only on an
# evaluation host with enough disk (see docs/RESOURCES.md).
eval = ["swebench==5.0.2"]

[project.scripts]
codetrace = "codetrace.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not rely on the editable-install .pth file (macOS may flag it hidden, which
# makes site.py skip it).
pythonpath = ["src"]
markers = [
    "network: requires network access (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures keep literal tool-call scripts on one line for readability.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["codetrace"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
